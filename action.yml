name: Test Intel coverage report
description: Turn an existing JavaScript or TypeScript coverage file into a prioritized gap report.
author: Petri Labs

branding:
  icon: target
  color: blue

inputs:
  coverage-path:
    description: Path to an lcov, Istanbul JSON, or Cobertura coverage file.
    required: true
  format:
    description: Coverage format. Leave empty to infer it from the filename.
    required: false
    default: ""

outputs:
  report:
    description: The full plain text coverage gap report.
    value: ${{ steps.report.outputs.report }}

runs:
  using: composite
  steps:
    - id: report
      name: Analyze coverage gaps
      shell: bash
      env:
        INPUT_COVERAGE_PATH: ${{ inputs.coverage-path }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        set +e
        package_version="$(node -p "require('$GITHUB_ACTION_PATH/package.json').version")"
        if [ -n "$INPUT_FORMAT" ]; then
          report="$(npx --yes --package "@barissozudogru/test-intel-mcp@${package_version}" test-intel-report "$INPUT_COVERAGE_PATH" "$INPUT_FORMAT" 2>&1)"
        else
          report="$(npx --yes --package "@barissozudogru/test-intel-mcp@${package_version}" test-intel-report "$INPUT_COVERAGE_PATH" 2>&1)"
        fi
        status=$?
        set -e

        delimiter="TEST_INTEL_REPORT_$(date +%s%N)"
        {
          echo "report<<${delimiter}"
          printf '%s\n' "$report"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## Test Intel coverage report"
          echo
          echo '```text'
          printf '%s\n' "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        printf '%s\n' "$report"
        exit "$status"
