<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">test-intel-mcp</title>
  <desc id="desc">Turn coverage into test priorities. Local analysis. No external service.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#272B3D" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#080910"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1100" cy="84" r="118" fill="#67E8F9" opacity="0.07" filter="url(#soft)"/>
  <rect x="48" y="44" width="1184" height="552" rx="4" fill="#0B0D15" stroke="#3B4058"/>
  <rect x="48" y="44" width="8" height="552" fill="#67E8F9"/>

  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">
    <text x="88" y="92" fill="#858AA6" font-size="18" letter-spacing="2.4">PETRI LABS / OPEN INSTRUMENT</text>
    <text x="1192" y="92" fill="#67E8F9" font-size="18" text-anchor="end">PL/T-02</text>

    <line x1="88" y1="122" x2="1192" y2="122" stroke="#272B3D"/>
    <circle cx="94" cy="176" r="6" fill="#67E8F9"/>
    <text x="88" y="260" fill="#E0E3F4" font-size="64" font-weight="700" letter-spacing="-2">test-intel-mcp</text>
    <text x="91" y="308" fill="#B7BBD4" font-size="25">Turn coverage into test priorities.</text>
    <text x="91" y="345" fill="#858AA6" font-size="21">Local analysis. No external service.</text>

    <g transform="translate(88 402)">
      <rect width="266" height="112" fill="#0F111C" stroke="#272B3D"/>
      <text x="18" y="31" fill="#5E637E" font-size="14" letter-spacing="1.6">INPUT</text>
      <text x="18" y="72" fill="#E0E3F4" font-size="18">COVERAGE + SOURCE</text>

      <rect x="278" width="266" height="112" fill="#0F111C" stroke="#272B3D"/>
      <text x="296" y="31" fill="#5E637E" font-size="14" letter-spacing="1.6">SIGNAL</text>
      <text x="296" y="72" fill="#67E8F9" font-size="18">GAPS + COMPLEXITY</text>

      <rect x="556" width="266" height="112" fill="#0F111C" stroke="#272B3D"/>
      <text x="574" y="31" fill="#5E637E" font-size="14" letter-spacing="1.6">OUTPUT</text>
      <text x="574" y="72" fill="#E0E3F4" font-size="18">TEST PRIORITY</text>

      <rect x="834" width="270" height="112" fill="#0F111C" stroke="#272B3D"/>
      <text x="852" y="31" fill="#5E637E" font-size="14" letter-spacing="1.6">RUNTIME</text>
      <text x="852" y="72" fill="#E0E3F4" font-size="18">MCP + NODE</text>
    </g>

    <text x="88" y="560" fill="#858AA6" font-size="17">petri-labs.org/tools/test-intel-mcp/</text>
    <text x="1192" y="560" fill="#5E637E" font-size="15" text-anchor="end">inspectable inputs / explicit limits</text>
  </g>
</svg>

